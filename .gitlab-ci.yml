default:
  image: ruby:3.4
  before_script:
    - bundle install --jobs 4
  cache:
    key: bundle
    paths:
      - vendor/bundle

variables:
  BUNDLE_PATH: vendor/bundle

stateless-mcp:
  script:
    - cd stateless-mcp && bundle exec rspec

stateless-mcp-rails:
  script:
    - cd stateless-mcp-rails && bundle exec rspec

rubocop:
  script:
    - bundle exec rubocop

# Each example has its own Gemfile, so the gems' specs never load Sinatra.
example-rack:
  variables:
    BUNDLE_GEMFILE: $CI_PROJECT_DIR/examples/rack/Gemfile
  script:
    - cd examples/rack && bundle exec ruby smoke.rb

example-sinatra:
  variables:
    BUNDLE_GEMFILE: $CI_PROJECT_DIR/examples/sinatra/Gemfile
  script:
    - cd examples/sinatra && bundle exec ruby smoke.rb
